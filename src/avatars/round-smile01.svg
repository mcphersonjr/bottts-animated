es" class="bn-eyes" data-eyes="round" transform="translate(8 20)"><g class="bn-eye-art"><g class="bn-eye-pair bn-look"><g class="bn-round-dot"><circle cx="24" cy="30" r="6" fill="#ffffff"/></g><g class="bn-round-dot"><circle cx="80" cy="30" r="6" fill="#ffffff"/></g></g></g></g></g><g class="bn-av-medium" opacity="0"/><g class="bn-tex-anim" opacity="0"/><g class="bn-talk-anim" opacity="0"/></svg>